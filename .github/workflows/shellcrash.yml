name: ShellCrash build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 每天的00:00触发
  push:
    branches:
      - run

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        PROJECT_NAME: shellcrash # 项目名称
        IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/shellcrash  # 镜像名称
        REPO_URL: ${{ vars.REPO_URL }}        # 新增：仓库URL变量
        REPO_PATH: ${{ vars.REPO_PATH }}      # 新增：仓库本地路径变量
        DOCKERFILE_NAME: Dockerfile
    steps:

      # 拉取私有仓库代码（使用 GitHub PAT）
      - name: Pull project code
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          # token 走 Authorization 请求头而非 URL userinfo：git/curl 跟随 30x 重定向时
          # 会丢弃 URL 里的 token，导致 401 + "could not read Username"，
          # 表现为时好时坏。详见 projects.yml 里的说明。
          set -euo pipefail
          URL="https://${REPO_URL#*://}"
          URL="${URL%/}"
          URL="${URL%.git}.git"
          AUTH="Authorization: Basic $(printf '%s' "x-access-token:$REPO_ACCESS_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$AUTH" clone "$URL" ${REPO_PATH}

      # 设置Docker构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # 登录DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 构建Docker镜像（支持多平台）并推送到DockerHub
      - name: Build and push
        run: |
          cd $REPO_PATH/$PROJECT_NAME
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm64/v8,linux/arm/v7,linux/s390x,linux/ppc64le,linux/386 \
            --file $DOCKERFILE_NAME \
            -t $IMAGE_NAME:$(date +'%Y%m%d') \
            -t $IMAGE_NAME \
            . --push
      

      

