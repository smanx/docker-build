name: HF Mirror (dataset / space -> 多账号)

# ============================================================================
# 所有配置都放在仓库 Variable 里：Settings -> Secrets and variables -> Actions
# -> Variables -> New repository variable，名字固定为 HF_MIRROR_CONFIG。
#
# 值是一个 JSON 数组：
#   - 数组的每个元素 = 一对账号（源账号 -> 目标账号），可以写很多对；
#   - 每对里的 repos 再列出这对账号之间要复制的仓库，一个源一个目标（1 对 1）。
#
# 账号名可以不写：不写就用 token 调 /api/whoami 自动识别「token 所属账号」，
# 所以最简形式只填两个 token 就够了。
#
# [
#   {
#     "source_token": "hf_xxx",
#     "target_token": "hf_yyy",
#     "private": true,
#     "repos": [
#       {"source": "my-dataset", "target": "my-dataset", "type": "dataset"},
#       {"source": "my-space", "type": "space", "private": false}
#     ]
#   },
#   {
#     "source_account": "acct3",
#     "target_account": "acct4",
#     "source_token": "hf_aaa",
#     "target_token": "hf_bbb",
#     "repos": [
#       {"source": "dataset-x", "type": "dataset"}
#     ]
#   }
# ]
#
# 字段：
#   source_account / target_account  账号名，可省略；省略时用对应 token 自动识别
#   source_token / target_token      HF token；target_token 必填，源公开时 source_token 可留空
#   private                          可选：本组所有映射的默认可见性；省略则跟随源仓库
#   repos[]                          仓库映射（1 对 1）
#     source / target                仓库名（自动补账号前缀）或 owner/name；
#                                    target 省略 = 和源同名
#     type                           dataset / space / model / auto（默认 auto）
#     private                        可选：覆盖本组的 private，仅对这条映射生效
#
# private 只作用于目标仓库，而且只在「目标仓库不存在、需要新建」时生效：
# 已存在的目标仓库不会被改公开/私有，源仓库永远不动。
# 优先级：映射里的 private > 本组 private > 跟随源仓库的可见性。
#
# 同步方式：按文件内容哈希比对，只下载/上传有变化的文件，不再 clone 整个仓库。
# 目标仓库不存在会自动创建；源和目标完全一致时直接跳过，不产生任何下载。
# 首次同步（或改动很大时）会按批次下载 -> 提交 -> 删除本地文件，磁盘占用被限制在
# 单批大小（默认 20 GB，可用仓库 Variable HF_MIRROR_BATCH_GB 调整），500G 的仓库
# 也不会把 runner 磁盘塞满；只有单个文件就超过 runner 可用磁盘时才需要自建 runner。
# 注意：这是「内容镜像」，只同步默认分支（main）的文件内容，不保留提交历史/tag；
#       目标端每批变化会生成一个 commit。
# 注意：Variable 里存的是明文，能改仓库配置的人都看得到，建议用只带 write 权限的独立 token。
# ============================================================================

on:
  schedule:
    - cron: '0 19 * * *'   # 每天凌晨 3 点（北京时间，UTC+8）= UTC 19:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查配置和仓库差异，不实际写入'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-mirror
  cancel-in-progress: false

env:
  HF_MIRROR_CONFIG: ${{ vars.HF_MIRROR_CONFIG }}
  HF_MIRROR_BATCH_GB: ${{ vars.HF_MIRROR_BATCH_GB }}
  HF_MIRROR_DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # 解析 Variable，生成「一个仓库映射一个 job」的矩阵（矩阵里不含 token）
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 解析配置
        id: plan
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          HF = "https://huggingface.co"

          def die(message):
              print("::error::" + message, flush=True)
              sys.exit(1)

          def mask(token):
              if isinstance(token, str) and token:
                  print("::add-mask::" + token, flush=True)

          def emit(key, value):
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  print(f"{key}={value}", flush=True)
                  return
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          def whoami_account(token):
              request = urllib.request.Request(HF + "/api/whoami-v2", method="GET")
              request.add_header("Authorization", "Bearer " + token)
              request.add_header("User-Agent", "hf-mirror-action")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  die(f"用 token 识别账号失败（HTTP {exc.code}），请检查 token 是否有效")
              except urllib.error.URLError as exc:
                  die(f"访问 Hugging Face 失败: {exc.reason}")
              try:
                  info = json.loads(body)
              except json.JSONDecodeError:
                  die("whoami 返回的不是合法 JSON")
              name = str(info.get("name") or "").strip()
              if not name:
                  die("whoami 没有返回账号名，请在配置里显式填写账号")
              return name

          raw = (os.environ.get("HF_MIRROR_CONFIG") or "").strip()
          if not raw:
              die("仓库 Variable HF_MIRROR_CONFIG 为空，请先配置 JSON 数组")

          try:
              pairs = json.loads(raw)
          except json.JSONDecodeError as exc:
              die(f"HF_MIRROR_CONFIG 不是合法 JSON: {exc}")

          if not isinstance(pairs, list) or not pairs:
              die("HF_MIRROR_CONFIG 必须是 JSON 数组，且至少包含一对账号")

          include = []
          for pair_index, pair in enumerate(pairs):
              if not isinstance(pair, dict):
                  die(f"第 {pair_index} 组配置必须是对象")

              mask(pair.get("source_token"))
              mask(pair.get("target_token"))
              source_token = str(pair.get("source_token") or "").strip()
              target_token = str(pair.get("target_token") or "").strip()
              if not target_token:
                  die(f"第 {pair_index} 组缺少 target_token")

              repos = pair.get("repos")
              if not isinstance(repos, list) or not repos:
                  die(f"第 {pair_index} 组缺少 repos 数组")

              resolved = {}

              def account_of(kind, pair_index=pair_index, pair=pair, resolved=resolved):
                  if kind in resolved:
                      return resolved[kind]
                  declared = str(pair.get(kind + "_account") or "").strip()
                  if declared:
                      resolved[kind] = declared
                      return declared
                  token = source_token if kind == "source" else target_token
                  if not token:
                      die(
                          f"第 {pair_index} 组没有 {kind}_account，"
                          f"也没有 {kind}_token 可以用来识别账号"
                      )
                  name = whoami_account(token)
                  print(
                      f"ℹ️ 第 {pair_index} 组没填 {kind}_account，"
                      f"按 token 识别为: {name}",
                      flush=True,
                  )
                  resolved[kind] = name
                  return name

              for repo_index, item in enumerate(repos):
                  if isinstance(item, str):
                      item = {"source": item}
                  if not isinstance(item, dict) or not item.get("source"):
                      die(f"第 {pair_index} 组第 {repo_index} 个映射缺少 source")

                  raw_source = str(item["source"]).strip()
                  source = (
                      raw_source
                      if "/" in raw_source
                      else f"{account_of('source')}/{raw_source}"
                  )
                  raw_target = str(item.get("target") or "").strip()
                  if raw_target:
                      target = (
                          raw_target
                          if "/" in raw_target
                          else f"{account_of('target')}/{raw_target}"
                      )
                  else:
                      # 没写 target：同名仓库放到目标账号下
                      name_part = raw_source.split("/", 1)[-1]
                      target = f"{account_of('target')}/{name_part}"
                  repo_type = str(item.get("type") or "auto").strip().lower()
                  if repo_type not in ("dataset", "space", "model", "auto"):
                      die(f"{source}: type 只能是 dataset / space / model / auto")

                  private = item.get("private")
                  if private is None:
                      private = pair.get("private")
                  private_hint = "auto" if private is None else ("true" if private else "false")

                  label = f"{source} -> {target}"

                  include.append(
                      {
                          "pair": pair_index,
                          "repo": repo_index,
                          "source": source,
                          "target": target,
                          "type": repo_type,
                          "private": private_hint,
                          "label": label,
                      }
                  )

          matrix = json.dumps({"include": include}, ensure_ascii=False, separators=(",", ":"))
          emit("matrix", matrix)

          rows = ["| 源 | 目标 | 类型 | 新建可见性 |", "| --- | --- | --- | --- |"]
          for entry in include:
              rows.append(
                  f"| {entry['source']} | {entry['target']} | {entry['type']} | {entry['private']} |"
              )

          summary = "### HF Mirror 计划\n\n" + "\n".join(rows)
          print(f"计划完成: {len(include)} 个仓库映射", flush=True)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(summary + "\n")
          PY

  # 一个仓库映射一个 job，并行跑；单个失败不影响其他
  mirror:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }}
    env:
      PAIR_INDEX: ${{ matrix.pair }}
      REPO_INDEX: ${{ matrix.repo }}
      SRC_REPO: ${{ matrix.source }}
      DST_REPO: ${{ matrix.target }}
      REPO_TYPE: ${{ matrix.type }}
      TARGET_PRIVATE: ${{ matrix.private }}
    steps:
      - name: 安装依赖
        run: pip install "huggingface_hub>=0.23"

      # 按文件哈希比对，只下载/上传有变化的文件，不 clone 整个仓库
      - name: 同步 ${{ matrix.source }} -> ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import sys
          import tempfile
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          from huggingface_hub import (
              CommitOperationAdd,
              CommitOperationDelete,
              HfApi,
              hf_hub_download,
          )

          SRC = os.environ["SRC_REPO"]
          DST = os.environ["DST_REPO"]
          TYPE_HINT = (os.environ.get("REPO_TYPE") or "auto").strip().lower()
          PRIVATE_HINT = (os.environ.get("TARGET_PRIVATE") or "auto").strip().lower()
          PAIR_INDEX = int(os.environ.get("PAIR_INDEX") or 0)
          REPO_INDEX = int(os.environ.get("REPO_INDEX") or 0)
          STARTED = time.time()
          DRY_RUN = (os.environ.get("HF_MIRROR_DRY_RUN") or "").strip().lower() in (
              "1",
              "true",
              "yes",
              "on",
          )
          CHUNK = 100
          BATCH_FILES = 200

          SECRETS = []

          def mask(token):
              if isinstance(token, str) and token:
                  SECRETS.append(token)
                  print("::add-mask::" + token, flush=True)

          def redact(text):
              text = str(text)
              for secret in sorted(SECRETS, key=len, reverse=True):
                  text = text.replace(secret, "***")
              return re.sub(r"(https://)[^/@\s]+:[^/@\s]+@", r"\1***:***@", text)

          def cell(text):
              return redact(str(text)).replace("|", "\\|").replace("\n", " ")

          def write_summary(markdown):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as handle:
                      handle.write(markdown + "\n")
              print(markdown, flush=True)

          def report(ok, message, repo_type="-", mode="incremental"):
              icon = "✅" if ok else "❌"
              elapsed = round(time.time() - STARTED, 1)
              write_summary(
                  "| 结果 | 源 | 目标 | 类型 | 方式 | 耗时(s) | 说明 |\n"
                  "| --- | --- | --- | --- | --- | --- | --- |\n"
                  f"| {icon} | {cell(SRC)} | {cell(DST)} | {repo_type} | {mode} | {elapsed} | {cell(message)} |"
              )

          def die(message):
              print("::error::" + redact(message), flush=True)
              report(False, message)
              sys.exit(1)

          # ---------- 读取这一对账号的配置和 token ----------
          raw = (os.environ.get("HF_MIRROR_CONFIG") or "").strip()
          if not raw:
              die("仓库 Variable HF_MIRROR_CONFIG 为空")
          try:
              pairs = json.loads(raw)
          except json.JSONDecodeError as exc:
              die(f"HF_MIRROR_CONFIG 不是合法 JSON: {exc}")
          if not isinstance(pairs, list) or PAIR_INDEX >= len(pairs):
              die(f"配置里找不到第 {PAIR_INDEX} 组账号")

          pair = pairs[PAIR_INDEX]
          repos = pair.get("repos") or []
          if REPO_INDEX >= len(repos):
              die(f"第 {PAIR_INDEX} 组配置里找不到第 {REPO_INDEX} 个仓库映射")

          SRC_TOKEN = str(pair.get("source_token") or "").strip()
          DST_TOKEN = str(pair.get("target_token") or "").strip()
          mask(SRC_TOKEN)
          mask(DST_TOKEN)
          if not DST_TOKEN:
              die(f"第 {PAIR_INDEX} 组缺少 target_token")

          api_src = HfApi(token=SRC_TOKEN)
          api_dst = HfApi(token=DST_TOKEN)

          # ---------- 探测源仓库 ----------
          def detect_type():
              if TYPE_HINT in ("dataset", "space", "model"):
                  try:
                      return TYPE_HINT, api_src.repo_info(SRC, repo_type=TYPE_HINT)
                  except Exception as exc:
                      die(f"无法读取源仓库 {SRC}（type={TYPE_HINT}）: {exc}")
              last_error = None
              for candidate in ("dataset", "space", "model"):
                  try:
                      return candidate, api_src.repo_info(SRC, repo_type=candidate)
                  except Exception as exc:
                      last_error = exc
              die(f"找不到源仓库 {SRC}，或 source_token 没有读权限: {last_error}")

          def ensure_target(repo_type, upstream, private):
              try:
                  info = api_dst.repo_info(DST, repo_type=repo_type)
                  current = bool(info.private)
                  if current != private:
                      print(
                          f"⚠️ 目标仓库已存在: {DST}（当前 private={current}，"
                          f"配置为 {private}，不会自动修改）",
                          flush=True,
                      )
                  else:
                      print(f"目标仓库已存在: {DST} (private={current})", flush=True)
                  return False
              except Exception as exc:
                  print(f"目标仓库不存在或无权访问（{type(exc).__name__}），准备创建: {DST}", flush=True)

              if DRY_RUN:
                  print(
                      f"[dry-run] 将创建目标仓库: {DST} (type={repo_type}, private={private})",
                      flush=True,
                  )
                  return True

              kwargs = {"repo_id": DST, "repo_type": repo_type, "private": private, "exist_ok": True}
              if repo_type == "space":
                  kwargs["space_sdk"] = getattr(upstream, "sdk", None) or "docker"
              try:
                  api_dst.create_repo(**kwargs)
              except Exception as exc:
                  die(f"创建目标仓库 {DST} 失败（token 需要属于该账号/组织）: {exc}")
              print(f"✅ 已创建目标仓库: {DST} (private={private})", flush=True)
              return True

          # ---------- 文件树比对（内容哈希） ----------
          def file_tree(api, repo_type, repo_id, token):
              files = {}
              for entry in api.list_repo_tree(
                  repo_id=repo_id,
                  repo_type=repo_type,
                  recursive=True,
                  expand=True,
                  token=token,
              ):
                  if getattr(entry, "size", None) is None:
                      continue
                  lfs = getattr(entry, "lfs", None)
                  oid = getattr(lfs, "sha256", None) if lfs else None
                  files[entry.path] = {
                      "oid": oid or getattr(entry, "blob_id", None) or f"size:{entry.size}",
                      "size": int(entry.size),
                  }
              return files

          # ---------- 主流程 ----------
          try:
              repo_type, upstream = detect_type()
              if PRIVATE_HINT in ("true", "false"):
                  private = PRIVATE_HINT == "true"
              else:
                  private = bool(getattr(upstream, "private", False))

              print(f"源: {SRC}（type={repo_type}, private={getattr(upstream, 'private', None)}）", flush=True)
              print(f"目标: {DST}（private={private}）", flush=True)

              created = ensure_target(repo_type, upstream, private)

              src_files = file_tree(api_src, repo_type, SRC, SRC_TOKEN)
              dst_files = {} if created else file_tree(api_dst, repo_type, DST, DST_TOKEN)

              changed = sorted(
                  (path, info["size"])
                  for path, info in src_files.items()
                  if (dst_files.get(path) or {}).get("oid") != info["oid"]
              )
              deleted = sorted(path for path in dst_files if path not in src_files)

              if not changed and not deleted:
                  print("源和目标文件内容完全一致，跳过同步", flush=True)
                  report(True, "已是最新，跳过", repo_type, "skip")
                  sys.exit(0)

              total_bytes = sum(size for _, size in changed)
              print(
                  f"需要同步: 新增/更新 {len(changed)} 个文件（{total_bytes / 1024**3:.1f} GB），"
                  f"删除 {len(deleted)} 个文件",
                  flush=True,
              )
              for path, _ in changed[:10]:
                  print(f"  M {path}", flush=True)
              if len(changed) > 10:
                  print(f"  ... 另外 {len(changed) - 10} 个更新", flush=True)
              for path in deleted[:10]:
                  print(f"  D {path}", flush=True)

              if DRY_RUN:
                  report(
                      True,
                      f"dry-run：将写入 {len(changed)} 个、删除 {len(deleted)} 个文件",
                      repo_type,
                      "incremental",
                  )
                  sys.exit(0)

              workdir = Path(tempfile.mkdtemp(prefix="hf-mirror-", dir=os.environ.get("RUNNER_TEMP") or None))
              try:
                  free = shutil.disk_usage(str(workdir)).free
                  try:
                      batch_gb = float(os.environ.get("HF_MIRROR_BATCH_GB") or 20)
                  except ValueError:
                      die(f"HF_MIRROR_BATCH_GB 不是数字: {os.environ.get('HF_MIRROR_BATCH_GB')}")
                  if batch_gb <= 0:
                      die(f"HF_MIRROR_BATCH_GB 必须大于 0: {batch_gb}")
                  # 每批最多占多少磁盘：配置值，且不超过可用空间的 60%
                  budget = min(int(batch_gb * 1024**3), int(free * 0.6))
                  if budget <= 0:
                      die(f"runner 可用磁盘不足: {free} 字节")
                  print(
                      f"批次预算: {budget / 1024**3:.1f} GB / 批"
                      f"（runner 可用磁盘 {free / 1024**3:.1f} GB）",
                      flush=True,
                  )

                  for path, size in changed:
                      if size > free * 0.8:
                          die(
                              f"单个文件 {path} 有 {size / 1024**3:.1f} GB，"
                              f"超过 runner 可用磁盘 {free / 1024**3:.1f} GB，"
                              "托管 runner 无法同步，请改用自建 runner"
                          )

                  # 按字节预算切批：下载一批 -> 提交 -> 删掉本地文件 -> 下一批
                  batches = []
                  current, current_bytes = [], 0
                  for path, size in changed:
                      if current and (current_bytes + size > budget or len(current) >= BATCH_FILES):
                          batches.append((current, current_bytes))
                          current, current_bytes = [], 0
                      current.append(path)
                      current_bytes += size
                  if current:
                      batches.append((current, current_bytes))
                  if not batches and deleted:
                      batches = [([], 0)]

                  done = 0
                  for index, (batch, batch_bytes) in enumerate(batches, 1):
                      batch_dir = workdir / f"batch-{index}"
                      batch_dir.mkdir(parents=True, exist_ok=True)

                      def download(path):
                          return path, hf_hub_download(
                              repo_id=SRC,
                              filename=path,
                              repo_type=repo_type,
                              token=SRC_TOKEN,
                              local_dir=str(batch_dir),
                          )

                      with ThreadPoolExecutor(max_workers=8) as pool:
                          downloaded = list(pool.map(download, batch))

                      operations = [
                          CommitOperationAdd(path_in_repo=path, path_or_fileobj=local)
                          for path, local in downloaded
                      ]
                      # 删除操作不占磁盘，放进第一批提交
                      if index == 1:
                          operations += [CommitOperationDelete(path_in_repo=path) for path in deleted]

                      message = f"Sync from {SRC} (batch {index}/{len(batches)}, {len(batch)} files)"
                      for start in range(0, len(operations), CHUNK):
                          api_dst.create_commit(
                              repo_id=DST,
                              repo_type=repo_type,
                              operations=operations[start : start + CHUNK],
                              commit_message=message,
                          )

                      done += len(batch)
                      print(
                          f"[{index}/{len(batches)}] 已提交 {len(batch)} 个文件"
                          f"（{batch_bytes / 1024**3:.1f} GB），累计 {done}/{len(changed)}",
                          flush=True,
                      )
                      shutil.rmtree(batch_dir, ignore_errors=True)

                  report(
                      True,
                      f"新增/更新 {len(changed)} 个文件，删除 {len(deleted)} 个文件"
                      f"（{len(batches)} 批）",
                      repo_type,
                      "incremental",
                  )
              finally:
                  shutil.rmtree(workdir, ignore_errors=True)
          except SystemExit:
              raise
          except Exception as exc:
              die(str(exc))
          PY
