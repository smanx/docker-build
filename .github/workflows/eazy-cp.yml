name: easy-cp build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'latest'
  # schedule:
  #   - cron: '0 0 * * *'  # 每天的00:00触发
  push:
    branches:
      - run

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: easy-cp  # 项目名称
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/easy-cp  # 镜像名称
      REPO_URL: ${{ vars.REPO_URL }}        # 新增：仓库URL变量
      REPO_PATH: ${{ vars.REPO_PATH }}      # 新增：仓库本地路径变量
      build_tag: ""  # 新增：定义 build_tag 变量

    steps:
      # 拉取私有仓库代码（使用 GitHub PAT）
      # token 走 Authorization 请求头，不放 URL userinfo —— git/curl 跟随 30x
      # 重定向时会丢弃 URL 里的 token，导致 401 + "could not read Username"，
      # 表现为时好时坏。详见 projects.yml 里的说明。
      - name: Pull project code
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://${REPO_URL#*://}"
          URL="${URL%/}"
          URL="${URL%.git}.git"
          echo "Pulling project code from $URL"
          AUTH="Authorization: Basic $(printf '%s' "x-access-token:$REPO_ACCESS_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$AUTH" clone "$URL" $REPO_PATH || { echo "Failed to clone repository"; exit 1; }

      # 设置 Docker 构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # 登录 DockerHub
      - name: Login to DockerHub
        run: |
          echo "Logging in to DockerHub"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || { echo "Failed to login to DockerHub"; exit 1; }

      # 构建
      - name: Build App and push Docker image with tags
        run: |
          echo "Building and pushing Docker image"
          cd $REPO_PATH/$PROJECT_NAME
          BUILD_TAGS="-t $IMAGE_NAME:latest"
          TIMESTAMP=$(date +%s)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILD_TIMESTAMP=$TIMESTAMP \
            $BUILD_TAGS \
            . --push || { echo "Failed to build and push Docker image"; exit 1; }           
