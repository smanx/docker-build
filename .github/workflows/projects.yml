name: projects build
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma-separated project names to build, e.g., "ouben1,ouben2,ouben3"'
        required: false
        default: 'openclaw,nanobot,open-auto-glm,opencode,deepseek-harness'
  schedule:
    - cron: '0 18 * * *'  # 每天的00:00触发
  push:
    branches:
      - run

env:
  DEFAULT_PROJECTS: 'openclaw,nanobot,open-auto-glm,opencode,deepseek-harness'

jobs:
  parse-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.parse.outputs.projects }}
    steps:
      - name: Parse projects
        id: parse
        run: |
          PROJECTS="${{ inputs.projects }}"
          # 如果 inputs.projects 为空，使用默认值
          if [ -z "$PROJECTS" ]; then
            PROJECTS="${{ env.DEFAULT_PROJECTS }}"
            echo "No projects input provided, using default: $PROJECTS"
          fi
          # 转换为 JSON 数组格式
          JSON_ARRAY=$(echo "$PROJECTS" | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/')
          echo "projects=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Parsed projects: $JSON_ARRAY"

  build:
    needs: parse-projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 新增：允许推送镜像到 GitHub Container Registry
    strategy:
      matrix:
        project: ${{ fromJson(needs.parse-projects.outputs.projects) }}
    env:
      # IMAGE_NAME / GHCR_IMAGE_NAME 由下面的 "Resolve image name" 步骤写入
      # $GITHUB_ENV：镜像仓库名可以被项目目录下的 .image-name 覆盖。
      REPO_URL: ${{ vars.REPO_URL }}        # 新增：仓库URL变量
      REPO_PATH: ${{ vars.REPO_PATH }}      # 新增：仓库本地路径变量
      PROJECT_NAME: ${{ matrix.project }}
    steps:
      # 拉取私有仓库代码（使用 GitHub PAT）
      - name: Pull project code
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          git clone https://${{ env.REPO_ACCESS_TOKEN }}@${{ env.REPO_URL}} ${{ env.REPO_PATH }}

      # 镜像仓库名默认就是项目名。项目根目录下如果存在 .image-name 文件，
      # 就用文件里第一行有效内容（不含 namespace）作为镜像仓库名。
      # 例：opencode2 目录下的 .image-name 写着 opencode，于是 V2 也推到 smanx/opencode，
      #     与 V1 共用一个仓库，靠 tag 区分。
      # 文件不存在、为空、只有注释，或内容不是合法的镜像名时，都回退到项目名。
      - name: Resolve image name
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.project }}"
          MARKER="${{ env.REPO_PATH }}/${{ env.PROJECT_NAME }}/.image-name"
          if [ -f "$MARKER" ]; then
            CUSTOM=$(tr -d '\r' < "$MARKER" | sed -e 's/[[:space:]]//g' -e '/^#/d' -e '/^$/d' | head -1)
            if printf '%s' "$CUSTOM" | grep -qE '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
              IMAGE="$CUSTOM"
            else
              echo "::warning::.image-name 里没有可用的镜像名（读到 '$CUSTOM'），改用项目名"
            fi
          fi
          echo "project=${{ matrix.project }}  image=$IMAGE"
          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$IMAGE" >> "$GITHUB_ENV"

      # 设置 Docker 构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # 登录 DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 登录 GitHub Container Registry
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 构建 Docker 镜像（仅 amd64 平台用于提取 APP_VERSION）
      - name: Build Docker image (amd64 only)
        run: |
          cd ${{ env.REPO_PATH }}/${{ env.PROJECT_NAME }}
          docker build -t $IMAGE_NAME:build .

      # 从镜像中提取 APP_VERSION 环境变量
      - name: Extract APP_VERSION from image
        id: version
        run: |
          # 启动容器
          CONTAINER_ID=$(docker run -d $IMAGE_NAME:build sleep 3600)
          
          # 直接复制文件到本地
          docker cp $CONTAINER_ID:/tmp/app_version.env /tmp/app_version.env 2>/dev/null || echo "" > /tmp/app_version.env
          
          # 停止并删除容器
          docker stop $CONTAINER_ID >/dev/null 2>&1 || true
          docker rm $CONTAINER_ID >/dev/null 2>&1 || true
          
          # 读取文件内容并提取 APP_VERSION
          if [ -f /tmp/app_version.env ]; then
            APP_VERSION=$(grep -oP 'APP_VERSION=\K[^[:space:]]+' /tmp/app_version.env 2>/dev/null || echo "")
            echo "Extracted APP_VERSION from file: '$APP_VERSION'"
          fi
          
          # 如果文件中没找到，尝试从环境变量获取
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(docker run --rm $IMAGE_NAME:build printenv APP_VERSION 2>/dev/null || echo "")
            echo "Extracted APP_VERSION from env: '$APP_VERSION'"
          fi
          
          # 校验版本号是否有效：不为空、不包含空格
          if [ -n "$APP_VERSION" ] && [[ ! "$APP_VERSION" =~ [[:space:]] ]]; then
            echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
            echo "Detected APP_VERSION: $APP_VERSION"
          else
            DATE_TAG=$(date +%Y%m%d)
            echo "version=$DATE_TAG" >> $GITHUB_OUTPUT
            echo "APP_VERSION not found or invalid, using date: $DATE_TAG"
          fi

      # 构建多平台镜像并推送到 DockerHub 和 GitHub Container Registry
      - name: Build and push multi-platform Docker image
        run: |
          VERSION_TAG="${{ steps.version.outputs.version }}"
          
          cd ${{ env.REPO_PATH }}/${{ env.PROJECT_NAME }}

          # 变体构建：项目目录存在 .build-variants 时，按其清单多打变体 tag
          # 每行格式：<tag前缀>|<该前缀要安装的 apt 工具列表（空格分隔）>
          # 构建时传 --build-arg DEV_TOOLS=<前缀>，由 Dockerfile 依据前缀
          # 从本文件读取工具列表安装（各前缀安装哪些工具在文件里定义）
          # 每个变体推送 4 个 tag：<前缀>-<版本号> / <前缀>-latest（Docker Hub 与 GHCR 各一组）
          # 没有该文件（或为空）时保持原逻辑，不构建变体
          VARIANT_FILE="./.build-variants"
          if [ -f "$VARIANT_FILE" ]; then
            while IFS='|' read -r PREFIX TOOLS || [ -n "$PREFIX" ]; do
              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --build-arg DEV_TOOLS=$PREFIX \
                -t $IMAGE_NAME:${PREFIX}-$VERSION_TAG \
                -t $IMAGE_NAME:${PREFIX}-latest \
                -t $GHCR_IMAGE_NAME:${PREFIX}-$VERSION_TAG \
                -t $GHCR_IMAGE_NAME:${PREFIX}-latest \
                . --push
              echo "✅ 变体构建完成: $PREFIX ($TOOLS)"
            done < <(grep -vE '^[[:space:]]*(#|$)' "$VARIANT_FILE")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:$VERSION_TAG \
            -t $IMAGE_NAME:latest \
            -t $GHCR_IMAGE_NAME:$VERSION_TAG \
            -t $GHCR_IMAGE_NAME:latest \
            . --push
